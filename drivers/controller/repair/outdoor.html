<!-- The Home Controller's only pairing page: the optional outdoor temperature sensor, the prices to follow
     (Power by the Hour price devices) and other heating meters outside the zones (issue #40).
     The same file serves pair and repair (drivers/controller/repair/outdoor.html, kept identical by a test). -->
<style>
  .hz-error { color: var(--homey-color-red-500, #d33); margin: 0.8em 0; }
  .hz-note { margin: 0.4em 0 0; opacity: 0.8; }
  .hz-meters { margin: 0.4em 0 0; }
</style>

<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.outdoor.title"></h1>
  <p class="homey-subtitle" data-i18n="pair.outdoor.subtitle"></p>
</header>

<form class="homey-form" onsubmit="return false">
  <div class="homey-form-group">
    <label class="homey-form-label" for="out-sensor" data-i18n="pair.outdoor.sensor"></label>
    <select class="homey-form-select" id="out-sensor"></select>
  </div>
  <div class="homey-form-group" id="out-cap-group" style="display: none">
    <label class="homey-form-label" for="out-cap" data-i18n="pair.members.temperature_cap"></label>
    <select class="homey-form-select" id="out-cap"></select>
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="out-prices" data-i18n="pair.prices.label"></label>
    <select class="homey-form-select" id="out-prices"></select>
    <p class="hz-note" id="out-prices-note"></p>
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" data-i18n="pair.meters.label"></label>
    <p class="hz-note" data-i18n="pair.meters.hint"></p>
    <fieldset class="homey-form-checkbox-set hz-meters" id="out-meters"></fieldset>
  </div>
  <p class="hz-error" id="out-error"></p>
  <button class="homey-button-primary-full" id="out-save" data-i18n="pair.members.save"></button>
</form>

<!-- Shown instead of the form when the controller exists already. -->
<div id="out-exists" style="display: none">
  <p id="out-exists-text"></p>
  <p data-i18n="pair.outdoor.exists_next"></p>
  <button class="homey-button-primary-full" id="out-close" data-i18n="pair.outdoor.close"></button>
</div>

<script type="application/javascript">
  (function () {
    // Own scope: Homey loads pairing views into one document, so top-level const/let would clash between pages.
    // Set from the session: repair changes the sensor of the existing controller.
    let repair = false;
    const sensorEl = document.getElementById('out-sensor');
    const capEl = document.getElementById('out-cap');
    const capGroup = document.getElementById('out-cap-group');
    const errorEl = document.getElementById('out-error');
    const saveEl = document.getElementById('out-save');
    const pricesEl = document.getElementById('out-prices');
    const pricesNoteEl = document.getElementById('out-prices-note');
    const metersEl = document.getElementById('out-meters');
    let sensors = [];

    function option(value, text) {
      const node = document.createElement('option');
      node.value = value;
      node.textContent = text;
      return node;
    }

    // Several temperatures on one device (e.g. measure_temperature.local): choose which one.
    function showCaps(selected) {
      const sensor = sensors.find((s) => s.id === sensorEl.value);
      capEl.innerHTML = '';
      const temps = sensor ? sensor.temperatures : [];
      for (const cap of temps) {
        const twin = temps.filter((other) => other.title === cap.title).length > 1;
        const title = twin ? `${cap.title} (${cap.id})` : cap.title;
        capEl.appendChild(option(cap.id, cap.reading ? `${title}: ${cap.reading}` : title));
      }
      if (selected && temps.some((cap) => cap.id === selected)) capEl.value = selected;
      capGroup.style.display = temps.length > 1 ? '' : 'none';
    }

    sensorEl.addEventListener('change', () => showCaps(null));

    // Power by the Hour's electricity price devices as "name (tariff type)", plus No prices.
    function showPrices({ devices, note, selected }) {
      pricesEl.appendChild(option('', Homey.__('pair.prices.none')));
      for (const device of devices) pricesEl.appendChild(option(device.id, `${device.name} (${Homey.__(`pair.prices.${device.tariffType}`)})`));
      // The current device may be missing while Power by the Hour is not running (repair): keep it.
      if (selected && !devices.some((device) => device.id === selected)) pricesEl.appendChild(option(selected, Homey.__('pair.prices.current')));
      pricesEl.value = selected || '';
      pricesNoteEl.textContent = note ? Homey.__(`pair.prices.${note}`) : '';
    }

    // Devices with a power meter; a zone's meter is shown but can't be picked, so nothing is counted twice.
    function showMeters(meters, picked) {
      if (!meters.length) {
        const none = document.createElement('p');
        none.className = 'hz-note';
        none.textContent = Homey.__('pair.meters.none');
        metersEl.appendChild(none);
        return;
      }
      for (const meter of meters) {
        const label = document.createElement('label');
        label.className = 'homey-form-checkbox';
        const input = document.createElement('input');
        input.className = 'homey-form-checkbox-input';
        input.type = 'checkbox';
        input.dataset.id = meter.id;
        input.checked = picked.includes(meter.id);
        input.disabled = !!meter.inZone && !input.checked;
        const mark = document.createElement('span');
        mark.className = 'homey-form-checkbox-checkmark';
        const text = document.createElement('span');
        text.className = 'homey-form-checkbox-text';
        const name = meter.zone ? `${meter.zone} · ${meter.name}` : meter.name;
        text.textContent = meter.inZone ? `${name} (${Homey.__('pair.meters.in_zone_short', { zone: meter.inZone })})` : name;
        label.append(input, mark, text);
        metersEl.appendChild(label);
      }
    }

    saveEl.addEventListener('click', async () => {
      errorEl.textContent = '';
      const outdoor = sensorEl.value ? { id: sensorEl.value, cap: capEl.value || null } : null;
      const priceSource = pricesEl.value;
      const otherMeters = [...metersEl.querySelectorAll('input:checked')].map((input) => input.dataset.id);
      // Saving can take a while (capabilities are added one by one): a spinner until it is done.
      Homey.showLoadingOverlay();
      try {
        if (repair) {
          await Homey.emit('save_outdoor', { outdoor, priceSource, otherMeters });
          Homey.done();
          return;
        }
        const device = await Homey.emit('create_controller', { outdoor, priceSource, otherMeters });
        await Homey.createDevice(device);
        Homey.done();
      } catch (error) {
        Homey.hideLoadingOverlay();
        errorEl.textContent = error.message || String(error);
      }
    });

    Homey.showLoadingOverlay();
    (async () => {
      try {
        const result = await Homey.emit('get_outdoor');
        if (result.exists) {
          document.querySelector('.homey-header').style.display = 'none';
          document.querySelector('.homey-form').style.display = 'none';
          document.getElementById('out-exists-text').textContent = result.exists;
          document.getElementById('out-close').addEventListener('click', () => Homey.done());
          document.getElementById('out-exists').style.display = '';
          return;
        }
        sensors = result.sensors;
        repair = result.repair === true;
        sensorEl.appendChild(option('', Homey.__('pair.outdoor.none')));
        for (const sensor of sensors) {
          const name = sensor.zone ? `${sensor.zone} · ${sensor.name}` : sensor.name;
          // The current reading helps to spot the real outdoor sensor among the indoor ones.
          const { reading } = sensor.temperatures[0];
          sensorEl.appendChild(option(sensor.id, reading ? `${name} (${reading})` : name));
        }
        sensorEl.value = result.outdoor ? result.outdoor.id : '';
        showCaps(result.outdoor ? result.outdoor.cap : null);
        showPrices(result.prices);
        showMeters(result.meters || [], result.otherMeters || []);
      } catch (error) {
        errorEl.textContent = error.message || String(error);
        saveEl.disabled = true;
      } finally {
        Homey.hideLoadingOverlay();
      }
    })();
  })();
</script>
